<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style/style.css">

    <title>Веб-разработчик</title>

    <script>
        // создаём объект с основной информацией
        let person = {
            surname: "Соколов",
            name: "Дмитрий",
            patronymic: "Игоревич",
            ocupation: "Веб-разработчик",
            degree: "Высшее",
            education: "Московский политехнический университет",
            qualification: "Frontend-разработчик",
            specialty: "Разработка веб-приложений",
            discipline: ["JavaScript", "React"]
        };

        // заполняем дополнительные свойства через prompt
        person.category = prompt("Введите категорию:", "Junior");
        person.experience = prompt("Введите стаж:", "1 год");
        person.email = prompt("Введите E-mail:", "example@mail.ru");
        person.site = prompt("Введите сайт-портфолио:", "https://example.com");

        // формируем строку с помощью шаблонных литералов
        let info = `
            <h1>${person.surname} ${person.name} ${person.patronymic}</h1>
            <h2>${person.ocupation}</h2>

            <hr class="info__hr">

            <h3>Основная информация:</h3>

            <ul class="info__list">
                <li>
                    <span class="info__item">Уровень образования: </span>
                    ${person.degree}
                </li>

                <li>
                    <span class="info__item">Образование: </span>
                    ${person.education}
                </li>

                <li>
                    <span class="info__item">Квалификация: </span>
                    ${person.qualification}
                </li>

                <li>
                    <span class="info__item">Специализация: </span>
                    ${person.specialty}
                </li>

                <li>
                    <span class="info__item">Ключевые навыки:</span>

                    <ul>
                        <li>${person.discipline[0]}</li>
                        <li>${person.discipline[1]}</li>
                    </ul>
                </li>
            </ul>

            <h3>Дополнительная информация:</h3>

            <ul class="info__list">
                <li>
                    <span class="info__item">Категория: </span>
                    ${person.category}
                </li>

                <li>
                    <span class="info__item">Стаж: </span>
                    ${person.experience}
                </li>

                <li>
                    <span class="info__item">E-mail: </span>
                    ${person.email}
                </li>

                <li>
                    <span class="info__item">Портфолио: </span>
                    ${person.site}
                </li>
            </ul>
        `;

        // после загрузки страницы выводим информацию в section.info
        window.onload = function () {
            document.querySelector(".info").innerHTML = info;
        };
    </script>
</head>

<body>

<header class="header">
    <nav class="header__nav">
        <ul class="header__list">
            <li class="header__item">
                <a href="#" class="header__link">Обо мне</a>
            </li>

            <li class="header__item">
                <a href="#" class="header__link">Проекты</a>
            </li>

            <li class="header__item">
                <a href="#" class="header__link">Навыки</a>
            </li>

            <li class="header__item">
                <a href="#" class="header__link">Контакты</a>
            </li>
        </ul>
    </nav>
</header>

<main class="container">

    <section class="foto">
        <img src="img/no-image.jpg" class="foto_pic" alt="Фото">
    </section>

    <section class="info">
    </section>

</main>

<footer class="footer">
    <nav class="footer__nav">
        <ul class="footer__list">
            <li class="footer__item">
                <a href="#" class="footer__link">Обо мне</a>
            </li>

            <li class="footer__item">
                <a href="#" class="footer__link">Проекты</a>
            </li>

            <li class="footer__item">
                <a href="#" class="footer__link">Навыки</a>
            </li>

            <li class="footer__item">
                <a href="#" class="footer__link">Контакты</a>
            </li>
        </ul>
    </nav>

    <div class="footer__info">
        Портфолио веб-разработчика. Все права защищены. 2026
    </div>
</footer>

</body>
</html>
